<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Inner Ear Pinna Cavity Gradient (Transparent Top-Outer to Warm Amber Bottom-Inner) -->
    <linearGradient id="earInnerCavity" x1="18%" y1="10%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#78350F" stop-opacity="0" />
      <stop offset="18%" stop-color="#78350F" stop-opacity="0.15" />
      <stop offset="55%" stop-color="#92400E" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="1" />
    </linearGradient>

    <!-- 1. UNIFIED LIGHT GRADIENT (Top-Lit: Bright Top -> Shadowed Bottom) -->
    <linearGradient id="gradLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="32%" stop-color="#FACC15" />
      <stop offset="72%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 2. UNIFIED DARK/SHADOW GRADIENT (Top-Lit: Warm Amber Top -> Deep Umber Bottom) -->
    <linearGradient id="gradDark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Directional Variants of #gradLight & #gradDark for 3D Corgi Facial Lighting -->
    <!-- Reversed (Shadowed Top -> Bright Bottom: Inner Ear Pinna, Under-Brow Eyes, Core-Lit Crystal, Under-Muzzle Chin) -->
    <linearGradient id="gradLightRev" href="#gradLight" x1="50%" y1="100%" x2="50%" y2="0%" />
    <linearGradient id="gradDarkRev" href="#gradDark" x1="50%" y1="100%" x2="50%" y2="0%" />

    <!-- Forehead Dome (Bright Top-Inner Skull Crown -> Shadowed Lower-Outer Temple & Brow Underside) -->
    <linearGradient id="gradLightBrow" href="#gradLight" x1="72%" y1="0%" x2="18%" y2="100%" />
    <linearGradient id="gradDarkBrow" href="#gradDark" x1="72%" y1="0%" x2="18%" y2="100%" />

    <!-- Cheekbone Ridge (Bright Upper-Outer Zygomatic Arch -> Shadowed Lower-Inner Jowl Crease) -->
    <linearGradient id="gradLightCheek" href="#gradLight" x1="15%" y1="0%" x2="85%" y2="100%" />
    <linearGradient id="gradDarkCheek" href="#gradDark" x1="15%" y1="0%" x2="85%" y2="100%" />
  </defs>

  <!-- Centered Corge Emblem: x = 195.09..828.91 (195.09px left/right padding), y = 125.20..898.80 (125.20px top/bottom padding) -->
  <g id="corge-emblem" transform="translate(0, 10.8)">
  <!-- 1. EARS (Exact 12.0px Light Borders & 18.0px Channels on Both Outer Ear Arch & Inner Ear Pinna) -->
  <g id="ear-left">
    <!-- Outer Ear Arch (#gradLight 12.0px uniform outer & bottom border) -->
    <path d="M 263.8 474.2 C 192 348 176 212 218 132 C 232 106 258 110 284 136 C 342 190 388 262 423 330.4 C 406 336.5 389.5 344 374 353 C 344 294 302 224 256 172 C 242 158 232 158 226 176 C 208 248 228 352 286 437.5 C 278 449.2 270.6 461.5 263.8 474.2 Z" fill="url(#gradLight)" />
    <!-- Outer Ear Arch Inner Fill (#gradDark inset by exact 12.0px perpendicular offset & De Casteljau inner walls) -->
    <path d="M 264.0 449.6 C 202.3 331.6 191.3 207.6 228.6 137.6 C 238.4 121.0 249.2 121.5 275.5 144.5 C 329.4 194.6 372.2 259.9 406.2 324.0 C 393.3 329.1 380.6 335.5 368.5 342.3 C 338.9 285.7 299.2 220.9 256.0 172.0 C 242.0 158.0 232.0 158.0 226.0 176.0 C 208.8 245.0 226.4 343.3 278.9 426.6 C 276.3 430.4 268.2 442.2 264.0 449.6 Z" fill="url(#gradDark)" />

    <!-- Inner Ear Pinna (Separated from Outer Ear Arch & Brow by 18.0px Dark Channel) -->
    <!-- Soft Dark-to-Amber Inner Ear Cavity -->
    <path d="M 248 190 C 232 256 248 346 297.2 421.7 C 315 402 334 383.5 354.5 366.5 C 325 306 289 244 248 190 Z" fill="url(#earInnerCavity)" />
    <!-- Exact 12.0px Constant-Width Light Border on Inner Ear Pinna (#gradLightRev: darker at shadowed top, brighter at bottom) -->
    <path d="M 254.7 199.0 C 292.9 250.8 326.6 309.3 354.5 366.5 C 334.0 383.5 315.0 402.0 297.2 421.7 C 294.9 418.2 292.7 414.7 290.6 411.2 C 305.8 394.3 322.3 378.4 339.6 363.3 C 312.7 309.3 280.9 254.7 245.1 206.1 Z" fill="url(#gradLightRev)" />
  </g>
  <use href="#ear-left" transform="translate(1024, 0) scale(-1, 1)" />

  <!-- 3. FOREHEAD / BROW ARCHES (Exact 18.0px Padding & 12.0px Borders — Bright Top-Inner Crown -> Shadowed Lower-Outer Temple) -->
  <g id="brow-left">
    <path d="M 503 334.9 C 430 336 362 368 312 432 C 276 478 248 548 226 622 L 404 486.5 Z" fill="url(#gradLightBrow)" />
    <path d="M 479.8 348.4 C 419.3 355.3 364.0 385.0 321.5 439.4 C 292.8 475.9 268.6 530.0 248.8 589.6 L 395.1 478.2 Z" fill="url(#gradDarkBrow)" />
  </g>
  <use href="#brow-left" transform="translate(1024, 0) scale(-1, 1)" />

  <!-- 4. CENTRAL DIAMOND ENERGY CORE (Exact 18.0px Padding & 12.0px Borders — Shadowed Upper Recess -> Bright Core Base Above Anvil) -->
  <g id="diamond-core">
    <polygon points="512,354 418,498 460,584 564,584 606,498" fill="url(#gradLightRev)" />
    <path id="crystal-half-left" d="M 506 385.1 L 434.4 494.9 L 463.7 504.9 L 506 444.1 Z M 506 465.1 L 472.5 513.2 L 487.2 572 L 506 572 Z M 436.3 508.2 L 461 516.6 L 474.8 572 L 467.5 572 Z" fill="url(#gradDarkRev)" />
    <use href="#crystal-half-left" transform="translate(1024, 0) scale(-1, 1)" />
  </g>

  <!-- 5. GEOMETRIC EYE TRIANGLES (Exact 18.0px Padding & 12.0px Borders — Shadowed Under Brow Overhang -> Bright Above Snout Bridge) -->
  <g id="eye-left">
    <polygon points="305.6,584 403.6,509.5 440,584" fill="url(#gradLightRev)" />
    <polygon points="341.2,572 399.2,527.9 420.8,572" fill="url(#gradDarkRev)" />
  </g>
  <use href="#eye-left" transform="translate(1024, 0) scale(-1, 1)" />

  <!-- 6. LOWER CHEEK FACETS (Exact 18.0px Padding & 12.0px Borders — Bright Upper-Outer Cheekbone -> Shadowed Inner Jowl Crease) -->
  <g id="cheek-left">
    <path d="M 237.3 636 L 296 591.4 C 318 638 364 668 416 681 C 432 685 438 691 438 696 C 438 702 428 708 390 724 L 390 770 Z" fill="url(#gradLightCheek)" />
    <path d="M 256.3 636.7 L 291.1 610.2 C 313 650 356 678 408 691 C 415 693 418 695 415 697.5 L 378 716.9 L 378 743.5 Z" fill="url(#gradDarkCheek)" />
  </g>
  <use href="#cheek-left" transform="translate(1024, 0) scale(-1, 1)" />

  <!-- 7. SYMMETRICAL FORGE ANVIL CENTERPIECE (Concentric Circular Arch R=52/64, 18.0px Padding & 12.0px Borders — Bright Snout Bridge -> Shadowed Base) -->
  <g id="forge-anvil">
    <path d="M 324 602 L 700 602 C 682 636 644 654 602 664 C 578 670 568 682 568 696 C 568 710 584 720 616 730 L 616 776 L 560.8 776 A 52 52 0 0 0 463.2 776 L 408 776 L 408 730 C 440 720 456 710 456 696 C 456 682 446 670 422 664 C 380 654 342 636 324 602 Z" fill="url(#gradLight)" />
    <path d="M 343.2 614 L 680.8 614 C 663 634 631 646 599 652.5 C 569 660 556 676 556 696 C 556 716 574 729 604 739 L 604 764 L 568.5 764 A 64 64 0 0 0 455.5 764 L 420 764 L 420 739 C 450 729 468 716 468 696 C 468 676 455 660 425 652.5 C 393 646 361 634 343.2 614 Z" fill="url(#gradDark)" />
  </g>

  <!-- 8. CHIN APEX (True Half-Circle Dome R=34/22 Concentric with Anvil Arch, 18.0px Padding & 12.0px Borders — Shadowed Under Muzzle Arch -> Bright Lower Chin Tip) -->
  <g id="chin-apex">
    <path d="M 408 794 L 478 794 A 34 34 0 0 1 546 794 L 616 794 L 512 888 Z" fill="url(#gradLightRev)" />
    <path d="M 439.2 806 L 490 806 L 490 794 A 22 22 0 0 1 534 794 L 534 806 L 584.8 806 L 512 871.8 Z" fill="url(#gradDarkRev)" />
  </g>
  </g>
</svg>
