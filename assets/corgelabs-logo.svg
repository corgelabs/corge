<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1024" width="2560" height="1024">
  <defs>
    <!-- Deep Obsidian Slate Background -->
    <radialGradient id="bgGrad" cx="36%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="55%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#060911" />
    </radialGradient>

    <!-- Warm Core Ambient Glow (Behind Corge Emblem) -->
    <radialGradient id="coreGlow" cx="50%" cy="54%" r="24%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.36" />
      <stop offset="48%" stop-color="#F59E0B" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Ambient Wordmark Glow -->
    <radialGradient id="wordmarkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.14" />
      <stop offset="65%" stop-color="#D97706" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0" />
    </radialGradient>

    <!-- Inner Ear Pinna Cavity Gradient -->
    <linearGradient id="earInnerCavity" x1="18%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#0B0F19" stop-opacity="0.96" />
      <stop offset="38%" stop-color="#451A03" stop-opacity="0.88" />
      <stop offset="78%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 1. UNIFIED LIGHT GRADIENT (Top-Lit: Bright Top -> Shadowed Bottom) -->
    <linearGradient id="gradLight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="32%" stop-color="#FACC15" />
      <stop offset="72%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- 2. UNIFIED DARK/SHADOW GRADIENT (Top-Lit: Warm Amber Top -> Deep Umber Bottom) -->
    <linearGradient id="gradDark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Directional Variants of #gradLight & #gradDark for 3D Corgi Facial Lighting -->
    <linearGradient id="gradLightRev" href="#gradLight" x1="50%" y1="100%" x2="50%" y2="0%" />
    <linearGradient id="gradDarkRev" href="#gradDark" x1="50%" y1="100%" x2="50%" y2="0%" />
    <linearGradient id="gradLightBrow" href="#gradLight" x1="72%" y1="0%" x2="18%" y2="100%" />
    <linearGradient id="gradDarkBrow" href="#gradDark" x1="72%" y1="0%" x2="18%" y2="100%" />
    <linearGradient id="gradLightCheek" href="#gradLight" x1="15%" y1="0%" x2="85%" y2="100%" />
    <linearGradient id="gradDarkCheek" href="#gradDark" x1="15%" y1="0%" x2="85%" y2="100%" />
  </defs>

  <!-- 1. Deep Obsidian Slate Background & Ambient Glows -->
  <rect width="2560" height="1024" fill="url(#bgGrad)" />
  <ellipse cx="1660" cy="512" rx="820" ry="260" fill="url(#wordmarkGlow)" />

